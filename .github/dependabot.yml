version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Hold new releases for a week before opening a bump — the supply-chain
    # cooldown that .npmrc's minimumReleaseAge cannot yet enforce on this pnpm.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        update-types:
          - 'major'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker-all:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-all:
        patterns:
          - '*'
