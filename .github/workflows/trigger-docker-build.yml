name: Docker Build

on:
  push:
    tags:
      - 'v*'
  # For release-watchdog.yml when a release tag's push event never arrives.
  workflow_dispatch:

run-name: 'Build os ${{ github.ref_name }}'

permissions:
  contents: read

jobs:
  prepare:
    name: 'Prepare'
    # Tags only: a branch's package.json still carries the last released version, so a
    # dispatch on a branch would overwrite that version's image with unreleased code.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-spa-docker-build.yml
    with:
      app_name: os
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.ref }}
      version: ${{ needs.prepare.outputs.version }}
      next_image_patterns: ${{ vars.NEXT_IMAGE_PATTERNS }}
    secrets: inherit
