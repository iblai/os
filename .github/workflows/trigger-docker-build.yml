name: Docker Build

on:
  push:
    tags:
      - 'v*'
  # For release-watchdog.yml when a release tag's push event never arrives.
  workflow_dispatch:

run-name: 'Build os ${{ github.ref_name }}'

permissions:
  contents: read

# A late push event and a watchdog dispatch must not build and push the same tags at once.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 'Prepare'
    # Release tags only, as in the push filter: any other ref's package.json still carries
    # the last released version, so building it would overwrite that image with unreleased code.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-spa-docker-build.yml
    with:
      app_name: os
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.ref }}
      version: ${{ needs.prepare.outputs.version }}
      next_image_patterns: ${{ vars.NEXT_IMAGE_PATTERNS }}
    secrets: inherit
