name: Security Audit

# Full-tree `pnpm audit`. Catches vulnerable packages already present in the
# dependency tree (the category the vitest / dompurify / @opentelemetry/core
# alerts fell into — all transitive, none introduced by the PR under review).
#
# - On pull_request: fails the check (blocks merge) on high/critical advisories.
# - Nightly:         opens/updates a tracking issue when findings appear, so
#                    newly published advisories against the existing tree get
#                    surfaced even when no PR is open.

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/security-audit.yml'
  schedule:
    # 03:17 UTC daily (off the hour to avoid the cron stampede).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Reads the pinned version from package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pnpm audit
        id: audit
        # pnpm audit reads pnpm-lock.yaml directly and queries the registry
        # advisory endpoint — no install / registry auth required.
        run: |
          set +e
          pnpm audit --audit-level=high | tee audit-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Surface report in job summary
        if: always()
        run: |
          {
            echo '## pnpm audit (level: high)'
            echo ''
            echo '```'
            cat audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8').slice(0, 60000);
            const title = '🔒 Security audit: vulnerable dependencies detected';
            const body = [
              'The nightly `pnpm audit --audit-level=high` found vulnerable',
              'dependencies in the tree.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              report,
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-audit',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body,
              });
              core.info(`Updated existing issue #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-audit'],
              });
              core.info('Opened new security-audit issue');
            }

      - name: Fail if vulnerabilities found
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
