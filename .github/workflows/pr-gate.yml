name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows: ['PR E2E Tests (Required)']
    types: [completed]

permissions:
  statuses: write
  pull-requests: read
  actions: read # update-gate reads the E2E run's jobs to derive the verdict

jobs:
  # ── On pull_request: set initial gate status ──
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set validation status
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const sha = context.payload.pull_request.head.sha;
            const branch = context.payload.pull_request.head.ref;

            // Release branches skip validation
            if (branch.startsWith('release/')) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'success',
                context: 'PR Validation',
                description: 'Release branch — validation skipped',
              });
              core.info('Release branch — auto-pass');
              return;
            }

            if (!labels.includes('run-tests')) {
              // No label — block merge until validation is triggered
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'failure',
                context: 'PR Validation',
                description: 'Add the run-tests label to trigger validation',
              });
              core.info('No run-tests label — gate blocks merge');
            } else {
              // Label present — block merge until validation workflow completes
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'pending',
                context: 'PR Validation',
                description: 'Waiting for PR E2E Tests to complete...',
              });
              core.info('run-tests label found — set pending, waiting for E2E tests');
            }

  # ── On workflow_run: update gate after E2E tests finish ──
  #
  # The verdict comes from the E2E JOB, never from the workflow-level conclusion. A workflow whose
  # jobs were all skipped concludes `success` — that is normal GitHub behaviour and it is NOT a
  # pass. Reading `workflow_run.conclusion` directly produced two live faults:
  #
  #   FALSE GREEN (the dangerous one). pr-e2e-tests.yml triggers on every `labeled` event, so
  #   applying ANY label to a PR that lacks `run-tests` starts a run whose `gate` is skipped,
  #   everything downstream is skipped, the workflow reports `success`, and this step published
  #   "PR E2E Tests passed" — overwriting the correct "Add the run-tests label" block. In lms,
  #   11 of 11 sampled sub-30s "successful" runs did exactly that: a required check went green
  #   having tested nothing, leaving the PR mergeable.
  #
  #   FALSE RED. concurrency (`pr-e2e-<PR#>`, cancel-in-progress) supersedes the older run when
  #   two events land together. Two labels applied in the same second put lms#232 into
  #   "PR E2E Tests cancelled" while the surviving run was still building.
  update-gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # iblai/pr-e2e-action keeps the sentence its PR comment leads with ("Not your code: …",
      # "12 tests failed …") as this artifact, so the merge box says what happened, linked to the
      # comment. Absent for runs that never reached e2e and for older action versions.
      - name: Fetch the e2e headline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-e2e-headline
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/e2e-headline

      - name: Update validation status from E2E result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const { owner, repo } = context.repo;

            // The merge box shows about 60 characters of the description; the API takes 140.
            const setStatus = (state, description, target_url) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha, state, context: 'PR Validation',
                description: description.length > 140 ? description.slice(0, 139) + '…' : description,
                ...(target_url ? { target_url } : {}),
              });

            // Release branches are auto-passed by the pull_request job above; don't undo that.
            if ((run.head_branch || '').startsWith('release/')) {
              core.info('release branch — leaving the auto-pass in place');
              return;
            }

            // A cancelled run is not a verdict — concurrency superseded it, and the run that
            // superseded it will post the real result. Writing `failure` here shows a healthy PR
            // as broken and, if this event arrives after the survivor's success, overwrites a
            // green check with nothing left to re-run it.
            if (run.conclusion === 'cancelled') {
              core.info('run cancelled (superseded by concurrency) — leaving the status alone');
              return;
            }

            // Never let an older run overwrite a newer one's verdict — but only defer to a
            // sibling that is STILL RUNNING. A completed sibling has had its turn: if it was
            // cancelled it wrote nothing and never will. Deferring on id alone deadlocked
            // lms#232: the same-second double-fire cancelled the HIGHER-id run (…781) and the
            // lower-id run (…626) survived and passed, so the passing verdict was never written
            // and the check sat on "pending" with nothing left to move it.
            const { data: siblings } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: run.workflow_id, head_sha: sha, per_page: 100,
            });
            if (siblings.workflow_runs.some(r => r.id > run.id && r.status !== 'completed')) {
              core.info(`newer run exists for ${sha.slice(0, 8)} — deferring to it`);
              return;
            }

            // The verdict: what did the jobs actually do?
            const { data: jobList } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100,
            });
            const gate = jobList.jobs.find(j => j.name === 'gate');
            const e2e  = jobList.jobs.find(j => j.name.startsWith('E2E'));

            // Gate skipped => no run-tests label (or a fork). This run tested nothing, so restore
            // the blocking status instead of passing. An unknown state must never yield a green
            // required check — that is the entire purpose of this gate.
            if (!gate || gate.conclusion === 'skipped') {
              await setStatus('failure', 'Add the run-tests label to trigger validation');
              core.info('gate skipped — this run tested nothing; restored the blocking status');
              return;
            }

            // Gate ran but E2E did not => an earlier job (build) failed. Name it and link it,
            // rather than blaming a missing label.
            if (!e2e || e2e.conclusion === 'skipped') {
              const failed = jobList.jobs.find(j => j.conclusion === 'failure' && j.name !== 'gate');
              await setStatus('failure',
                failed ? `Not tested: the ${failed.name} job failed` : 'PR E2E Tests did not run — an earlier job failed',
                failed ? failed.html_url : run.html_url);
              core.info('E2E skipped despite gate passing — upstream job failure');
              return;
            }

            // The state comes from the E2E job; the artifact only words it. Read it as data:
            // its links must point at this repo's PR comments or the public report.
            let head = {};
            try {
              head = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/e2e-headline/pr-e2e-headline.json`, 'utf8'));
            } catch (e) {
              core.info('no pr-e2e-headline artifact — using the generic description');
            }
            const ours = new RegExp(`^https://github\\.com/${owner}/${repo}/(pull|issues)/\\d+#issuecomment-\\d+$`);
            const link = [head.comment_url, head.report_url].find(u => typeof u === 'string'
              && (ours.test(u) || /^https:\/\/tests\.iblai\.app\/[\w\-./]+$/.test(u))) || e2e.html_url;
            const said = typeof head.headline === 'string' ? head.headline.replace(/\s+/g, ' ').trim() : '';
            const passed = e2e.conclusion === 'success';
            await setStatus(
              passed ? 'success' : 'failure',
              said || (passed ? 'PR E2E Tests passed' : `PR E2E Tests ${e2e.conclusion}`),
              link,
            );
            core.info(`E2E job ${e2e.conclusion} — PR Validation ${passed ? 'success' : 'failure'}`);
