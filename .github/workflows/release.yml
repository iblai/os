name: Release

on:
  push:
    branches: [main]
  # For release-watchdog.yml when a merge's push event never arrives. Safe to run at
  # any time: it releases whatever is unreleased on main, or nothing.
  workflow_dispatch:

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Skip our own release commits (loop) and tauri version bumps (separate track)
    if: "github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'chore(tauri):')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25.3.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to latest main
        # Rebase onto anything that landed after this run was triggered (e.g. a
        # racing tauri version bump from tauri-autoversion.yml) so release-it's
        # push fast-forwards instead of failing non-fast-forward.
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Check for unreleased commits
        id: pending
        # A run can find its commits already released (by the run it queued behind, or a
        # watchdog dispatch that raced a late push event). release-it would still cut an
        # empty patch release, since the changelog preset recommends patch for no commits.
        # Hand-cut tags (e.g. -patch.1) are not releases, so they never count as the base.
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*')
          count=$(git log --format=%s "$last..HEAD" | grep -cvE '^chore\((release|tauri)\):' || true)
          echo "$count unreleased commit(s) since $last"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run release-it
        if: steps.pending.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          HUSKY: '0'
        run: pnpm release --ci
