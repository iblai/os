name: Release

on:
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Skip our own release commits (loop) and tauri version bumps (separate track)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'chore(tauri):')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25.3.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to latest main
        # Rebase onto anything that landed after this run was triggered (e.g. a
        # racing tauri version bump from tauri-autoversion.yml) so release-it's
        # push fast-forwards instead of failing non-fast-forward.
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          HUSKY: '0'
        run: pnpm release --ci
