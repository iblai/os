name: ibl-ai-os
options:
  bundleIdPrefix: ai.ibl.mentorai
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: ibl.ai
      PRODUCT_BUNDLE_IDENTIFIER: ai.ibl.mentorai
      DEVELOPMENT_TEAM: L4FWRM8W5Z
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ibl-ai-os_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Visible in Xcode only: libapp.a is linked through LIBRARY_SEARCH_PATHS
      # (see dependencies), and a build phase here copied it INTO the app
      # bundle, which App Store validation rejects.
      - path: Externals
        buildPhase: none
      - path: ibl-ai-os_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: ibl-ai-os_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.1.20
        CFBundleVersion: "6"
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: The camera scans your computer's Code pairing QR code and takes photos to send in chat.
        NSMicrophoneUsageDescription: The microphone is used for voice chat, voice calls and recording voice messages.
        NSPhotoLibraryUsageDescription: The photo library lets you pick images to send in chat or use as a mentor image.
        NSLocalNetworkUsageDescription: Code mode connects to the desktop app on your computer over your local network.
        # Deep links (SSO callback / mentor links) and the settings below were
        # only in the generated Info.plist; the spec must carry everything the
        # plist has, or a regeneration silently drops them.
        CFBundleURLTypes:
          - CFBundleURLName: iblai-mentor
            CFBundleURLSchemes: [iblai-mentor, ai.ibl.mentorai]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: ibl-ai-os_iOS/ibl-ai-os_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # build-rust.sh, not `cargo tauri ios xcode-script`: the latter needs
      # a parent tauri CLI to talk to and fails with "Connection refused"
      # from a plain Xcode archive. Keep in step with project.pbxproj.
      - script: '"$SRCROOT/build-rust.sh"'
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a