# Policy for `cargo deny` — supply-chain checks on the Rust (desktop app)
# dependency tree: RUSTSEC advisories, crate sources, and licences.
# Triaged advisories are listed under [advisories].ignore with a reason.

[advisories]
version = 2
yanked = "deny"
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "why it does not apply" }]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
]
