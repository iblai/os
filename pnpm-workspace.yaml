onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver

# Security version floors. They previously lived in the `pnpm` field of
# package.json, which pnpm v10 no longer reads — this file is the supported home
# for them (and for patchedDependencies, below).
#
# NOTE: web-containers is now consumed exclusively via @iblai/iblai-js
# (>=1.20.11), which bundles the i18n-aware build (WebContainersI18nProvider +
# the re-exported components share a single context). The previous
# `@iblai/web-containers: file:.yalc/...` override is therefore obsolete and was
# removed — it broke CI installs since .yalc is gitignored.
overrides:
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  undici: '>=6.24.0'
  hono: '>=4.12.18'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  dompurify: '>=3.4.11'
  '@hono/node-server': '>=1.19.13'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  fast-uri: '>=4.1.1'
  ip-address: '>=10.1.1'
  # brace-expansion GHSA-mh99-v99m-4gvg (DoS/OOM via unbounded expansion) is patched
  # ONLY in 5.0.8 — there is no patched 1.x/2.x/3.x/4.x. But brace-expansion@5 ships
  # ESM-style named exports, so older minimatch majors that import it as a CJS
  # callable default crash with "brace_expansion.default is not a function". Two such
  # consumers exist here:
  #   - minimatch@9 (glob@10 -> test-exclude -> @vitest/coverage-istanbul): bumped to
  #     v10 below, which reads the named export. This unbroke the coverage check.
  #   - minimatch@3 (eslint@9, @eslint/eslintrc, @eslint/config-array + plugins, and
  #     rollup-plugin-copy's glob@7): NOT bumped. minimatch only touches
  #     brace-expansion when a pattern contains a `{...}` brace group; no eslint glob
  #     here uses one, so `pnpm lint` never hits the non-callable path. This is a
  #     latent hazard, not a fix: if a brace pattern is ever added to eslint.config or
  #     a lint-time glob, lint will crash with "expand is not a function". The fix then
  #     is to add `minimatch@3: '^10'` here — but verify eslint@9 + glob@7 tolerate
  #     minimatch@10 first (untested; minimatch@10 requires Node 20+ and drops legacy
  #     options). Bumping minimatch@3 blindly is riskier than the latent hazard today.
  brace-expansion: '>=5.0.8'
  minimatch@9: '^10'
  postcss: '>=8.5.18'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: '11.1.1'
  sharp: '>=0.35.0'

# pnpm v10 no longer reads `pnpm.patchedDependencies` from package.json — it must
# live here or the google-drive-picker scope patch silently stops applying
# (see patches/google-drive-picker@1.1.29.patch and its regression test).
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch
