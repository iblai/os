onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver

# Security version floors. They previously lived in the `pnpm` field of
# package.json, which pnpm v10 no longer reads — this file is the supported home
# for them (and for patchedDependencies, below).
#
# NOTE: web-containers is now consumed exclusively via @iblai/iblai-js
# (>=1.20.11), which bundles the i18n-aware build (WebContainersI18nProvider +
# the re-exported components share a single context). The previous
# `@iblai/web-containers: file:.yalc/...` override is therefore obsolete and was
# removed — it broke CI installs since .yalc is gitignored.
overrides:
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  undici: '>=6.24.0'
  hono: '>=4.12.18'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  dompurify: '>=3.4.11'
  '@hono/node-server': '>=1.19.13'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  fast-uri: '>=4.1.1'
  ip-address: '>=10.1.1'
  # brace-expansion is split across majors with incompatible import styles, so a
  # single global pin can't work (see CVE-2025-5889, ReDoS, patched in each line):
  #   - minimatch@3 (^1.1.7) and minimatch@9 (^2.0.2, used by glob/test-exclude/
  #     istanbul coverage) call it as a CJS-callable default -> needs the 2.x line.
  #   - minimatch@10 (^5.0.5) imports the named `{ expand }` -> needs the 5.x line.
  # Forcing everything to 5.x breaks minimatch@9 ("default is not a function");
  # forcing everything to 2.x breaks minimatch@10 ("expand is not a function").
  # Default to the patched 2.x callable line; scope the patched 5.x to minimatch@10.
  brace-expansion: '>=2.0.2 <3'
  minimatch@10>brace-expansion: '>=5.0.8'
  postcss: '>=8.5.18'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: '11.1.1'
  sharp: '>=0.35.0'

# pnpm v10 no longer reads `pnpm.patchedDependencies` from package.json — it must
# live here or the google-drive-picker scope patch silently stops applying
# (see patches/google-drive-picker@1.1.29.patch and its regression test).
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch
