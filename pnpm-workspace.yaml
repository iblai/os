onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver

# Security version floors. They previously lived in the `pnpm` field of
# package.json, which pnpm v10 no longer reads — this file is the supported home
# for them (and for patchedDependencies, below).
#
# NOTE: the @iblai `file:.yalc/...` overrides pin every consumer (including
# @iblai/iblai-js's own `"*"` deps on data-layer/web-utils/web-containers) to
# the yalc-pushed builds. Without them pnpm satisfies those `"*"` ranges from
# the registry, so the app and the SDK re-exports load two different copies —
# missing new components (e.g. AgentHumanSupportTab) and duplicated React
# contexts. These must be dropped (together with the file:.yalc specs in
# package.json) once the new SDK versions are published — .yalc is gitignored,
# so CI installs fail while they're in place.
overrides:
  '@iblai/iblai-js': 'file:.yalc/@iblai/iblai-js'
  '@iblai/data-layer': 'file:.yalc/@iblai/data-layer'
  '@iblai/web-utils': 'file:.yalc/@iblai/web-utils'
  '@iblai/web-containers': 'file:.yalc/@iblai/web-containers'
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  undici: '>=6.24.0'
  hono: '>=4.12.18'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  dompurify: '>=3.4.11'
  '@hono/node-server': '>=1.19.13'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  fast-uri: '>=4.1.1'
  ip-address: '>=10.1.1'
  brace-expansion: '>=5.0.6'
  'minimatch@^9>brace-expansion': '2.1.2'
  postcss: '>=8.5.10'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: '11.1.1'
  sharp: '>=0.35.0'

# pnpm v10 no longer reads `pnpm.patchedDependencies` from package.json — it must
# live here or the google-drive-picker scope patch silently stops applying
# (see patches/google-drive-picker@1.1.29.patch and its regression test).
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch
