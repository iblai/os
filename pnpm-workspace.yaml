auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
minimumReleaseAgeExclude:
  - '@iblai/*'
onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver
overrides:
  # yalc dev: force EVERY consumer (iblai-js's re-export shims included) onto
  # the yalc copies — without these, transitive deps resolve to the registry
  # and the app runs two different SDK builds at once.
  '@iblai/web-utils': 'file:.yalc/@iblai/web-utils'
  '@iblai/web-containers': 'file:.yalc/@iblai/web-containers'
  '@iblai/data-layer': 'file:.yalc/@iblai/data-layer'
  '@iblai/agent-ai': 'file:.yalc/@iblai/agent-ai'
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  js-yaml: '>=4.3.1 <5'
  undici: '>=8.9.0'
  hono: '>=4.12.34'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  dompurify: '>=3.4.13'
  deepmerge-ts: '>=8.0.0'
  nanoid: '>=3.3.17 <4'
  '@hono/node-server': '>=2.0.10'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  fast-uri: '>=4.1.2'
  ip-address: '>=10.3.1'
  brace-expansion: '>=5.0.9'
  glob@10>minimatch: '>=10.2.5'
  postcss: '>=8.5.23'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: 11.1.1
  sharp: '>=0.35.0'
  brace-expansion@<=5.0.8: '>=5.0.9'
  serialize-javascript: '>=7.0.5'
  '@puppeteer/browsers': '>=3.0.2'
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch
