onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver
overrides:
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  undici: '>=6.24.0'
  hono: '>=4.12.18'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  dompurify: '>=3.4.12'
  '@hono/node-server': '>=2.0.10'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  fast-uri: '>=4.1.1'
  ip-address: '>=10.1.1'
  # brace-expansion GHSA-mh99-v99m-4gvg (DoS/OOM via unbounded expansion) is patched
  # ONLY in 5.0.8 — there is no patched 1.x/2.x/3.x/4.x. But brace-expansion@5 uses
  # ESM-style named exports, and the minimatch@9 pulled solely by
  # @vitest/coverage-istanbul (glob@10 -> test-exclude, a devDependency) imports it
  # as a CJS default -> "brace_expansion.default is not a function", crashing the
  # coverage check. So pin brace-expansion to the patched 5.0.8 everywhere and bump
  # that lone dev-only minimatch@9 to v10, which reads the named export. minimatch@3
  # (via rollup-plugin-copy inside @iblai/*) is build tooling never executed here, so
  # its 5.x callable mismatch is inert and left alone.
  brace-expansion: '>=5.0.8'
  # GHSA-mh99-v99m-4gvg is only fixed in brace-expansion >=5.0.8, but 5.x exports
  # an object ({ expand, EXPANSION_MAX* }) where minimatch@9 does
  # `import expand from 'brace-expansion'` and CALLS it — so pinning 5.x under
  # minimatch@9 breaks vitest's coverage chain at runtime. minimatch@10 consumes
  # the new named export, so lift glob's minimatch instead and let the global
  # >=5.0.8 floor apply. (glob@10 -> minimatch@9 was the last vulnerable path:
  # @vitest/coverage-istanbul > test-exclude > glob > minimatch.)
  glob@10>minimatch: '>=10.2.5'
  postcss: '>=8.5.18'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: 11.1.1
  sharp: '>=0.35.0'
  brace-expansion@<=5.0.7: '>=5.0.8'
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch

# trust iblai packages
#
#
minimumReleaseAgeExclude:
  - '@iblai/*'
