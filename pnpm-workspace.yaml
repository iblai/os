  ip-address: '>=10.3.1'
  brace-expansion: '>=5.0.9'
  glob@10>minimatch: '>=10.2.5'
  postcss: '>=8.5.23'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: 11.1.1
  sharp: '>=0.35.0'
  brace-expansion@<=5.0.8: '>=5.0.9'
  serialize-javascript: '>=7.0.5'
  '@puppeteer/browsers': '>=3.0.2'
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch
  # Three missing Pandoc/markdown-it-katex rules for dollar-delimited text math:
  #   1. A single `$` preceded by whitespace cannot close a span. Without it a
  #      currency `$100-$200` earlier in a block pairs with the `$` opening a
  #      later `$\ce{...}$`, typesetting the prose between them.
  #   2. A `$`/`$$` span cannot cross a line ending. Without it a `$$` on one
  #      line of a paragraph pairs with a `$$` many lines below, swallowing
  #      every line in between (issue #2441). Only `mathText` is restricted;
  #      `latexMathText` (`\[..\]`, `\(..\)`) and `mathFlow` (a `$$` fence on
  #      its own line) are separate tokenizers and still span lines.
  #   3. A closing dollar run stops as soon as it matches the opening run.
  #      `close()` used to swallow the whole run before comparing lengths, so
  #      `$a$$b$` (runs 1, 2, 1) saw a closing run of two, demoted it to body
  #      data and closed on the final `$` with the invalid body `a$$b`. Checking
  #      the length first leaves the second `$` of the `$$` unconsumed, so it
  #      opens the next span and `$a$$b$` renders as two adjacent spans. The
  #      `previous` guard is relaxed to match: a `$` may follow a `$` (only a
  #      bare `\` is still refused), otherwise the second span could never open.
  # Upstream issue drafted; drop this patch once it lands.
  '@ziloen/remark-math@0.1.1': patches/@ziloen__remark-math@0.1.1.patch

# trust iblai packages
#
#
minimumReleaseAgeExclude:
  - '@iblai/*'

auditConfig:
  ignoreGhsas:
    # extract-zip symlink traversal (GHSA-jmr9-qjv8-65gv) — no patched release
    # exists; the advisory's patched range is <0.0.0. Dev-only reach:
    # @wdio/cli > @puppeteer/browsers uses it to unpack browser downloads
    # fetched from vendor CDNs.
    - GHSA-jmr9-qjv8-65gv
