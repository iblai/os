onlyBuiltDependencies:
  - '@sentry/cli'
  - canvas
  - core-js
  - esbuild
  - husky
  - sharp
  - unrs-resolver
overrides:
  vite: '>=7.3.2'
  basic-ftp: '>=5.2.1'
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.5'
  lodash-es: '>=4.18.0'
  lodash: '>=4.18.0'
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 — quadratic CPU consumption resolving
  # !!omap, affecting >=4.0.0 <4.3.1. Surfaced by `pnpm audit`, not Dependabot.
  # Dev-only here (commitlint > cosmiconfig, eslintrc, mocha), so there is no
  # production exposure, but the audit gate blocks on high regardless. 4.3.1 is a
  # patch bump and every consumer already asks for ^4.1.0, so the floor lifts
  # without crossing a major. Upper bound is deliberate: a bare '>=4.3.1' pulls
  # 5.x, which every consumer here declares itself incompatible with.
  js-yaml: '>=4.3.1 <5'
  # GHSA-4cwx-7wf7-3272 (cross-user information disclosure) affects >=8.0.0 <8.9.0.
  # Only 8.7.0 resolves here (@wdio/local-runner > webdriver), so lifting the floor
  # past the 6.x line is safe — nothing depends on a 6.x or 7.x undici.
  undici: '>=8.9.0'
  # GHSA-8j4g-w8fx-2239 — ReDoS in the CORS middleware via a crafted
  # Access-Control-Request-Headers, patched in 4.12.34. Not surfaced by Dependabot;
  # found by `pnpm audit`. Reached through
  # @iblai/iblai-js > @iblai/mcp > @modelcontextprotocol/sdk.
  hono: '>=4.12.34'
  axios: '>=1.16.0'
  prismjs: '>=1.30.0'
  # Floor raised 3.4.12 -> 3.4.13 for GHSA-55q2-fjhq-7xh7: IN_PLACE hook removal
  # leaves a detached subtree executable (XSS). Reached through
  # @iblai/iblai-js > @iblai/web-containers.
  dompurify: '>=3.4.13'
  # GHSA-ggr8-5vv4-36mx — stack exhaustion when merging recursive object
  # graphs, patched only in 8.0.0. Reached solely through the e2e stack
  # (@wdio/config, @wdio/utils — even the latest wdio 9.30.1 still declares
  # ^7), so crossing the major here is the only route. Safe: v8 keeps the
  # deepmerge/deepmergeCustom API wdio calls; its breaking change is dropping
  # Node <20, and this repo runs 25.
  deepmerge-ts: '>=8.0.0'
  # GHSA-2v37-7h3g-55p8 — custom generators loop indefinitely when size is 0,
  # patched in 3.3.17. Reached through postcss. Upper bound is deliberate:
  # nanoid 4+ is ESM-only and postcss requires the CJS 3.x line.
  nanoid: '>=3.3.17 <4'
  '@hono/node-server': '>=2.0.10'
  bytes: '>=1.11.1'
  devalue: '>=5.8.1'
  # GHSA-7p8r-x3mc-p8w7 — host confusion via backslash, patched in 4.1.2.
  # Reached through @commitlint/cli > @commitlint/load.
  fast-uri: '>=4.1.2'
  # GHSA-mwp4-54f8-5fhr — Address4 decodes leading-zero octets as decimal, so an
  # address like 010.0.0.1 parses to an unintended host. Patched in 10.3.1.
  # Reached through @wdio/cli > @wdio/utils > @puppeteer/browsers > proxy-agent.
  ip-address: '>=10.3.1'
  # brace-expansion GHSA-mh99-v99m-4gvg (DoS/OOM via unbounded expansion) is patched
  # ONLY in 5.0.8 — there is no patched 1.x/2.x/3.x/4.x. But brace-expansion@5 ships
  # ESM-style named exports, so older minimatch majors that import it as a CJS
  # callable default crash with "brace_expansion.default is not a function". Two such
  # consumers exist here:
  #   - minimatch@9 (glob@10 -> test-exclude -> @vitest/coverage-istanbul): bumped to
  #     v10 below, which reads the named export. This unbroke the coverage check.
  #   - minimatch@3 (eslint@9, @eslint/eslintrc, @eslint/config-array + plugins, and
  #     rollup-plugin-copy's glob@7): NOT bumped. minimatch only touches
  #     brace-expansion when a pattern contains a `{...}` brace group; no eslint glob
  #     here uses one, so `pnpm lint` never hits the non-callable path. This is a
  #     latent hazard, not a fix: if a brace pattern is ever added to eslint.config or
  #     a lint-time glob, lint will crash with "expand is not a function". The fix then
  #     is to add `minimatch@3: '^10'` here — but verify eslint@9 + glob@7 tolerate
  #     minimatch@10 first (untested; minimatch@10 requires Node 20+ and drops legacy
  #     options). Bumping minimatch@3 blindly is riskier than the latent hazard today.
  # Floor raised 5.0.8 -> 5.0.9 for GHSA-rgw5-rvv9-x895: unbounded intermediate
  # arrays still allow the DoS that CVE-2026-14257 was meant to stop, so 5.0.8 is
  # no longer sufficient. Same major, so the minimatch analysis above still holds.
  brace-expansion: '>=5.0.9'
  # GHSA-mh99-v99m-4gvg is only fixed in brace-expansion >=5.0.8, but 5.x exports
  # an object ({ expand, EXPANSION_MAX* }) where minimatch@9 does
  # `import expand from 'brace-expansion'` and CALLS it — so pinning 5.x under
  # minimatch@9 breaks vitest's coverage chain at runtime. minimatch@10 consumes
  # the new named export, so lift glob's minimatch instead and let the global
  # >=5.0.8 floor apply. (glob@10 -> minimatch@9 was the last vulnerable path:
  # @vitest/coverage-istanbul > test-exclude > glob > minimatch.)
  glob@10>minimatch: '>=10.2.5'
  # Floor raised 8.5.18 -> 8.5.23 for the incomplete-fix follow-up to
  # GHSA-6g55-p6wh-862q: an attacker-controlled sourceMappingURL still reads
  # arbitrary .map files when `from` is unset. package.json declares 8.5.24 to match,
  # so Dependabot stops flagging the manifest as vulnerable.
  postcss: '>=8.5.23'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  uuid: 11.1.1
  sharp: '>=0.35.0'
  brace-expansion@<=5.0.8: '>=5.0.9'
  # serialize-javascript GHSA-5c6j-r48x-rmvq (RCE via RegExp.flags/Date, patched
  # 7.0.3) and GHSA-qj8w-gfj5-8c6v (CPU-exhaustion DoS, patched 7.0.5). Reached by
  # one path only: e2e-tauri's @wdio/mocha-framework > mocha > serialize-javascript.
  # There is no upstream bump to wait for — even mocha@11 still declares ^6.0.2 —
  # so crossing the major here is the only route. Safe: v7 keeps the same CJS
  # default-export signature and the `unsafe`/`ignoreFunction` options mocha passes,
  # needs Node >=20 (this repo is on 25), and mocha's only call site is
  # buffered-worker-pool's serializeOptions, which runs solely under `--parallel` —
  # a mode the wdio runner never enables.
  serialize-javascript: '>=7.0.5'
  # deepmerge-ts GHSA-ggr8-5vv4-36mx (stack exhaustion merging recursive object
  # graphs, patched 8.0.0). Reached only through e2e-tauri's wdio 9.30 tooling
  # (@wdio/cli > @wdio/config, @wdio/utils), which declares ^7 — no upstream
  # bump to wait for yet. Crossing the major is safe here: v8 keeps the same
  # exports wdio consumes (deepmerge/deepmergeCustom) and only raises the Node
  # floor to >=16 (this repo runs 25).
  deepmerge-ts: '>=8.0.0'
  # extract-zip GHSA-jmr9-qjv8-65gv (unvalidated symlink path traversal) has NO
  # patched release — 2.0.1 is the latest ever published and the advisory lists
  # "patched: <0.0.0". The only remedy is removing it from the tree:
  # @puppeteer/browsers dropped extract-zip in 3.0 (replaced by modern-tar), so
  # lift wdio's transitive 2.13.2. Cross-major is safe for our one consumer:
  # @wdio/utils imports install/canDownload/resolveBuildId/
  # detectBrowserPlatform/Browser/ChromeReleaseChannel/computeExecutablePath,
  # all still exported by 3.x (the 3.0 break was the archive/download
  # internals — exactly where extract-zip lived).
  '@puppeteer/browsers': '>=3.0.2'
patchedDependencies:
  google-drive-picker@1.1.29: patches/google-drive-picker@1.1.29.patch

# trust iblai packages
#
#
minimumReleaseAgeExclude:
  - '@iblai/*'

auditConfig:
  ignoreGhsas:
    # extract-zip symlink traversal (GHSA-jmr9-qjv8-65gv) — no patched release
    # exists; the advisory's patched range is <0.0.0. Dev-only reach:
    # @wdio/cli > @puppeteer/browsers uses it to unpack browser downloads
    # fetched from vendor CDNs.
    - GHSA-jmr9-qjv8-65gv
